name: PR 703 Saved Plan Links Isolated Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/admin/configurations/page.tsx'
      - 'components/admin/product-ledger-client.tsx'
      - 'lib/data/product-ledger-usage.ts'
      - 'e2e/pr703-ledger-configuration-links.spec.ts'
      - '.github/workflows/pr703-ledger-configuration-links-browser.yml'

permissions:
  contents: read

concurrency:
  group: pr703-configuration-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WING_LOCAL_MODE: '1'
      WING_LOCAL_DIR: '.wing-local/e2e'
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SITE_URL: ''
    steps:
      - name: Checkout review candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Assert isolated localhost and no production DB credentials
        run: |
          test "$WING_LOCAL_MODE" = '1'
          test -z "$NEXT_PUBLIC_SUPABASE_URL"
          test -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "${BASE_URL:-}"

      - name: Execute actual admin list and ledger links on desktop and Pixel 7
        run: |
          mkdir -p e2e/artifacts
          npx playwright test e2e/pr703-ledger-configuration-links.spec.ts --project=desktop

      - name: Upload PC and mobile screenshots, failing traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr703-saved-plan-links-browser-evidence
          path: |
            e2e/artifacts/pr703-*.png
            test-results/
          retention-days: 14
          if-no-files-found: ignore
