# Supabase プロジェクト設定（`supabase config push` でリモートへ反映する項目のみ）
project_id = "sen-no-kaze-wing-system"

[auth]
enabled = true
# 本番は独自ドメイン（www）。値の変更・反映（supabase config push）は本番の設定変更として別途行う（docs/custom-domain-settings.md）
site_url = "https://www.sen-no-kaze.com"
additional_redirect_urls = [
  "https://www.sen-no-kaze.com/auth/callback",
  "https://www.sen-no-kaze.com/**",
  # 切り替え前に送ったメールのリンク（Vercel の既定のドメイン）からも戻れるよう、しばらく残す
  "https://sen-no-kaze-wing-system.vercel.app/auth/callback",
  "https://sen-no-kaze-wing-system.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# MVP: 確認メール（SMTP 未設定）を待たずにログインできるようにする。
# 2026-11-25：本部先行の運用開始の時に true にする（本番の設定を変えるのと同じ時に、ここも変える。docs/mail-setup.md）
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

# 認証メールの日本語の文面（2026-11-25）。本番への反映は、SMTP の設定と一緒に本番の設定変更として行う（docs/mail-setup.md）
[auth.email.template.confirmation]
subject = "【千の風プロジェクト】メールアドレスの確認"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "【千の風プロジェクト】パスワードの再設定"
content_path = "./supabase/templates/recovery.html"
