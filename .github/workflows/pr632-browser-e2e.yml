name: PR632 Temporary Browser E2E

on:
  push:
    branches:
      - ui/product-completion-return-to-ledger-20261111

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WING_LOCAL_MODE: '1'
      WING_LOCAL_DIR: '.wing-local/pr632-e2e'
      WING_LOCAL_RESET: '1'
      WING_LOCAL_ADMIN_EMAILS: 'admin@example.com'
      NEXT_PUBLIC_SITE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node packages
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E against disposable local store
        run: npm run test:e2e -- e2e/pr632-navigation.spec.ts --project=desktop
      - name: Save Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr632-playwright-failure
          path: test-results/
          if-no-files-found: ignore
