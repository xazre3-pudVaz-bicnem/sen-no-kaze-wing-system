# Supabase プロジェクト設定（`supabase config push` でリモートへ反映する項目のみ）
project_id = "sen-no-kaze-wing-system"

[auth]
enabled = true
# 本番は独自ドメイン（www）。値の変更・反映（supabase config push）は本番の設定変更として別途行う（docs/custom-domain-settings.md）
site_url = "https://www.sen-no-kaze.com"
additional_redirect_urls = [
  "https://www.sen-no-kaze.com/auth/callback",
  "https://www.sen-no-kaze.com/**",
  # 切り替え前に送ったメールのリンク（Vercel の既定のドメイン）からも戻れるよう、しばらく残す
  "https://sen-no-kaze-wing-system.vercel.app/auth/callback",
  "https://sen-no-kaze-wing-system.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# MVP: 確認メール（SMTP 未設定）を待たずにログインできるようにする
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
