name: V25 Compact Menus and Direct Sale Isolated Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/admin/standard-estimate-v25-workbench.tsx'
      - 'e2e/fixtures/v25-row-direct-sale-page.tsx.fixture'
      - 'e2e/v25-row-direct-sale.spec.ts'
      - 'e2e/v25-row-direct-sale-mobile.spec.ts'
      - '.github/workflows/v25-row-direct-sale-browser.yml'

permissions:
  contents: read

concurrency:
  group: v25-row-direct-sale-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WING_LOCAL_MODE: '1'
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SITE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Assert disposable local-only test environment
        run: |
          test "$WING_LOCAL_MODE" = 1
          test -z "$NEXT_PUBLIC_SUPABASE_URL"
          test -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "${BASE_URL:-}"
      - name: Add isolated fixture without writing to production DB
        run: |
          mkdir -p app/v25-e2e-row-sale
          cp e2e/fixtures/v25-row-direct-sale-page.tsx.fixture app/v25-e2e-row-sale/page.tsx
      - name: Test PC and mobile menu and direct-sale operations
        run: npx playwright test e2e/v25-row-direct-sale.spec.ts e2e/v25-row-direct-sale-mobile.spec.ts --project=desktop --project=mobile
      - name: Attach failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25-row-direct-sale-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
