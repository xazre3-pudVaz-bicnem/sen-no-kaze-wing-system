name: PR 681 Isolated Picker Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/simulator/option-picker-dialog.tsx'
      - 'components/simulator/product-list.tsx'
      - 'components/simulator/product-detail.tsx'
      - 'components/simulator/exterior-wall-faces-dialog.tsx'
      - 'components/simulator/simulator-app.tsx'
      - 'lib/domain/simulator-product-choice-guide.ts'
      - 'e2e/pr681-product-picker.spec.ts'
      - 'e2e/pr681-picker-mobile.spec.ts'
      - 'e2e/fixtures/pr681-local-picker-page.tsx'
      - '.github/workflows/pr681-product-picker-browser.yml'

permissions:
  contents: read

concurrency:
  group: pr681-product-picker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  picker-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WING_LOCAL_MODE: '1'
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_SITE_URL: ''
    steps:
      - name: Checkout disposable PR merge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium

      - name: Reject external database and browser endpoints
        run: |
          test "$WING_LOCAL_MODE" = 1
          test -z "$NEXT_PUBLIC_SUPABASE_URL"
          test -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "${BASE_URL:-}"

      - name: Install fixture route only on disposable local runner
        run: |
          test "$WING_LOCAL_MODE" = 1
          test -z "$NEXT_PUBLIC_SUPABASE_URL"
          test -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p app/__e2e_pr681_picker
          cp e2e/fixtures/pr681-local-picker-page.tsx app/__e2e_pr681_picker/page.tsx

      - name: Test PR 681 picker on disposable desktop/mobile Chromium
        run: npx playwright test e2e/pr681-product-picker.spec.ts e2e/pr681-picker-mobile.spec.ts --project=desktop --project=mobile

      - name: Upload isolated browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr681-picker-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
