name: Temporary formal quote legacy E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-formal-quote-e2e.yml

permissions:
  contents: read

jobs:
  verify-legacy-formal-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify formal quote lifecycle in isolated local mode
        run: >-
          npx playwright test e2e/dealer-quote.spec.ts e2e/operations.spec.ts
          --project=desktop
          --grep '割り当て → 案件見積の編集|金額未確定の明細が残る間|見積依頼・代理店割当・確定見積・承諾'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-quote-legacy-e2e-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
